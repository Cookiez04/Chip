<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip & Mallow: The Conscious Duo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 1.2rem; pointer-events: none; transition: opacity 0.5s; z-index: 10;
        }
        
        .controls-info {
            position: absolute; bottom: 20px; left: 20px; color: rgba(255, 255, 255, 0.5);
            pointer-events: none; font-size: 0.8rem; z-index: 5;
        }

        /* --- Thought Bubble --- */
        #thought-bubble {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, 0) scale(0);
            max-width: 280px; background: white; padding: 15px 20px; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 15;
            font-size: 14px; color: #333; text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27), opacity 0.4s;
            opacity: 0; pointer-events: none;
        }
        #thought-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent;
        }
        #thought-bubble.visible { transform: translate(-50%, 0) scale(1); opacity: 1; }

        /* --- Chat UI Styles --- */
        #chat-toggle-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #dca35b, #8d5524);
            border: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        #chat-toggle-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
        
        #chat-window {
            position: absolute; bottom: 100px; right: 30px; z-index: 20;
            width: 350px; height: 450px;
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            overflow: hidden;
            transform-origin: bottom right;
            transition: transform 0.3s ease, opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0; pointer-events: none; transform: scale(0.9);
        }
        #chat-window.open { opacity: 1; pointer-events: all; transform: scale(1); }

        .chat-header {
            padding: 15px 20px; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #fff; font-weight: bold; display: flex; align-items: center; gap: 10px;
            justify-content: space-between;
        }
        .status-indicator { font-size: 0.7rem; opacity: 0.7; font-weight: normal; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; }
        
        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 80%; padding: 10px 14px; border-radius: 12px;
            font-size: 0.9rem; line-height: 1.4; position: relative;
            word-wrap: break-word;
        }
        .message.user { align-self: flex-end; background: #4455ff; color: white; border-bottom-right-radius: 2px; }
        .message.chip { align-self: flex-start; background: #3e2723; color: #ffd; border-bottom-left-radius: 2px; border: 1px solid #dca35b; }
        .message.system { align-self: center; background: transparent; color: rgba(255,255,255,0.4); font-size: 0.8rem; font-style: italic; text-align: center; }

        .chat-input-area { padding: 15px; background: rgba(0,0,0,0.2); display: flex; gap: 10px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.1); border: none; border-radius: 20px; padding: 10px 15px; color: white; outline: none; }
        #send-btn { background: #dca35b; border: none; color: #1a1a1a; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Baking Consciousness...</div>
    <div id="thought-bubble">Initializing...</div>
    <div id="canvas-container"></div>
    <div class="controls-info">Mouse Move: Rotate | Scroll: Zoom | Watch Chip Live</div>

    <!-- Chat Interface -->
    <button id="chat-toggle-btn" title="Chat with Chip">✨</button>
    <div id="chat-window">
        <div class="chat-header">
            <div><span>🍪</span> Chip</div>
            <div id="consciousness-status" class="status-indicator">Thinking...</div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message chip">I've got legs now! And a little friend called Mallow. Let's explore! ✨</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- Gemini API Setup ---
        const apiKey = "AIzaSyCGDX6BmjNHIioCXav1BvqWyBuiFcWOL6o"; 
        
        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202025);
        scene.fog = new THREE.Fog(0x202025, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 22); // Slightly higher/further back

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.SoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 40;
        controls.target.set(0, 2, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeeb1, 1.5);
        mainLight.position.set(5, 15, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const rimLight = new THREE.SpotLight(0x4455ff, 2.0);
        rimLight.position.set(-10, 5, -5);
        rimLight.lookAt(0, 0, 0);
        scene.add(rimLight);

        // --- Materials ---
        const cookieMaterial = new THREE.MeshStandardMaterial({ color: 0xdca35b, roughness: 0.9, bumpScale: 0.1 });
        const chipMaterial = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.4, metalness: 0.1 });
        const glassesFrameMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.1 });
        const glassesLensMaterial = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.0, metalness: 0.8 });
        const laptopBodyMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3, metalness: 0.7 });
        const screenMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const bookCoverMaterial = new THREE.MeshStandardMaterial({ color: 0x8e44ad, roughness: 0.6 });
        const bookPagesMaterial = new THREE.MeshStandardMaterial({ color: 0xfffdd0, roughness: 0.9 });
        const wandMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.4 });
        const wandTipMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        
        // Added missing material definition
        const limbMaterial = cookieMaterial;

        // --- Global Rig Reference ---
        const rig = {
            group: new THREE.Group(),
            body: null,
            head: new THREE.Group(), // For glasses/mouth/chips
            leftArmPivot: new THREE.Group(),
            rightArmPivot: new THREE.Group(),
            leftLegPivot: new THREE.Group(),
            rightLegPivot: new THREE.Group(),
            leftHand: new THREE.Group(), // To attach props
            rightHand: new THREE.Group()
        };
        scene.add(rig.group);

        // --- Character Construction (Rigged) ---

        // 1. Body (Root)
        const bodyGeo = new THREE.CylinderGeometry(4, 4, 1.2, 32);
        bodyGeo.rotateX(Math.PI / 2);
        const body = new THREE.Mesh(bodyGeo, cookieMaterial);
        body.castShadow = true; body.receiveShadow = true;
        rig.group.add(body);
        rig.body = body;
        rig.body.add(rig.head);

        // 2. Face (Attached to Head Group)
        // Chips
        const chipGeo = new THREE.SphereGeometry(0.4, 16, 16);
        chipGeo.scale(1, 1, 0.4);
        const chipPositions = [
            {x: 1.5, y: 2.5}, {x: -1.5, y: 2.8}, {x: 0, y: 3.2}, {x: -2.5, y: 1.0}, {x: 2.8, y: 0.5},
            {x: 1.0, y: -2.5}, {x: -1.2, y: -3.0}, {x: -2.8, y: -1.5}, {x: 2.2, y: -2.0}, {x: 0.5, y: 0.5}, {x: -0.8, y: 1.5}
        ];
        chipPositions.forEach(pos => {
            const chip = new THREE.Mesh(chipGeo, chipMaterial);
            chip.position.set(pos.x, pos.y, 0.6);
            chip.rotation.z = Math.random() * Math.PI;
            rig.head.add(chip);
        });

        // Glasses
        const glassesGroup = new THREE.Group();
        glassesGroup.position.set(0, 0.8, 0.8);
        rig.head.add(glassesGroup);
        const lensGeo = new RoundedBoxGeometry(1.8, 1.4, 0.2, 4, 0.2);
        const leftLens = new THREE.Mesh(lensGeo, glassesLensMaterial); leftLens.position.set(-1, 0, 0); leftLens.rotation.z = 0.1; glassesGroup.add(leftLens);
        const rightLens = new THREE.Mesh(lensGeo, glassesLensMaterial); rightLens.position.set(1, 0, 0); rightLens.rotation.z = -0.1; glassesGroup.add(rightLens);
        const bridgeGeo = new THREE.BoxGeometry(0.6, 0.2, 0.1); const bridge = new THREE.Mesh(bridgeGeo, glassesFrameMaterial); bridge.position.set(0, 0.2, 0); glassesGroup.add(bridge);
        const armGeo = new THREE.BoxGeometry(0.2, 0.2, 3.5);
        const leftArm = new THREE.Mesh(armGeo, glassesFrameMaterial); leftArm.position.set(-2, 0.2, -1.5); glassesGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, glassesFrameMaterial); rightArm.position.set(2, 0.2, -1.5); glassesGroup.add(rightArm);

        // Mouth
        const mouthGeo = new THREE.TorusGeometry(1.2, 0.15, 8, 32, Math.PI);
        const mouth = new THREE.Mesh(mouthGeo, new THREE.MeshStandardMaterial({color: 0x3e2723}));
        mouth.rotation.x = Math.PI; mouth.position.set(0, -1.5, 0.62);
        rig.head.add(mouth);

        // 3. Limbs (Pivot Based)
        function createLimbMesh(points, radius = 0.25) {
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 12, radius, 8, false);
            const mesh = new THREE.Mesh(tubeGeo, limbMaterial); mesh.castShadow = true;
            return mesh;
        }

        // Left Arm
        rig.leftArmPivot.position.set(-3.5, 0, 0); // Shoulder position
        rig.group.add(rig.leftArmPivot);
        // Points relative to pivot (0,0,0 is shoulder)
        const lArmPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(-1, -1, 1), new THREE.Vector3(0.5, -2, 3)];
        const lArmMesh = createLimbMesh(lArmPts);
        rig.leftArmPivot.add(lArmMesh);
        // Hand attached to end of arm mesh (approximate)
        rig.leftHand.position.set(0.5, -2, 3);
        rig.leftArmPivot.add(rig.leftHand);
        const lHandMesh = new THREE.Mesh(new THREE.SphereGeometry(0.6), limbMaterial);
        rig.leftHand.add(lHandMesh);

        // Right Arm
        rig.rightArmPivot.position.set(3.5, 0, 0);
        rig.group.add(rig.rightArmPivot);
        const rArmPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, -1, 1), new THREE.Vector3(-0.5, -2, 3)]; // Resting forward slightly
        const rArmMesh = createLimbMesh(rArmPts);
        rig.rightArmPivot.add(rArmMesh);
        rig.rightHand.position.set(-0.5, -2, 3);
        rig.rightArmPivot.add(rig.rightHand);
        const rHandMesh = new THREE.Mesh(new THREE.SphereGeometry(0.6), limbMaterial);
        rig.rightHand.add(rHandMesh);

        // Left Leg
        rig.leftLegPivot.position.set(-1.5, -3.5, 0); // Hip position
        rig.group.add(rig.leftLegPivot);
        const lLegPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(-0.5, -2.5, 0), new THREE.Vector3(-1, -2.5, 1)]; // Foot relative to hip
        const lLegMesh = createLimbMesh(lLegPts, 0.3);
        rig.leftLegPivot.add(lLegMesh);

        // Right Leg
        rig.rightLegPivot.position.set(1.5, -3.5, 0);
        rig.group.add(rig.rightLegPivot);
        const rLegPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.5, -2.5, 0), new THREE.Vector3(1, -2.5, 1)];
        const rLegMesh = createLimbMesh(rLegPts, 0.3);
        rig.rightLegPivot.add(rLegMesh);

        // --- Props & Sidekick ---

        const props = {
            laptop: new THREE.Group(),
            book: new THREE.Group(),
            wand: new THREE.Group()
        };

        // Laptop
        const baseGeo = new THREE.BoxGeometry(3, 0.2, 2); const base = new THREE.Mesh(baseGeo, laptopBodyMaterial); props.laptop.add(base);
        const screenGroup = new THREE.Group(); screenGroup.position.set(0, 0.1, -1); props.laptop.add(screenGroup);
        const lidGeo = new THREE.BoxGeometry(3, 2, 0.1); const lid = new THREE.Mesh(lidGeo, laptopBodyMaterial); lid.position.set(0, 1, 0); screenGroup.add(lid);
        const displayGeo = new THREE.PlaneGeometry(2.6, 1.6); const display = new THREE.Mesh(displayGeo, screenMaterial); display.position.set(0, 1, 0.06); screenGroup.add(display);
        screenGroup.rotation.x = 0.5;
        props.laptop.visible = false;
        // Attach laptop to left hand default but we will re-parent it logic
        scene.add(props.laptop); // Add to scene to manipulate world pos easily

        // Book
        const bookCover = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 0.4), bookCoverMaterial);
        const bookPages = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.3, 0.35), bookPagesMaterial);
        bookPages.position.x = 0.1;
        props.book.add(bookCover); props.book.add(bookPages);
        props.book.visible = false;
        rig.rightHand.add(props.book); // Held in right hand
        props.book.rotation.set(0, -Math.PI/2, -0.5);

        // Magic Wand
        const wandShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 3), wandMaterial);
        const wandTip = new THREE.Mesh(new THREE.SphereGeometry(0.15), wandTipMaterial);
        wandTip.position.y = 1.5;
        props.wand.add(wandShaft); props.wand.add(wandTip);
        props.wand.rotation.z = -Math.PI / 4;
        props.wand.visible = false;
        rig.rightHand.add(props.wand);


        // --- Mallow (Sidekick) ---
        const mallow = new THREE.Group();
        const mallowBody = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 1.2, 16), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.3}));
        const mallowEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x000000}));
        const mallowEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x000000}));
        mallowEyeL.position.set(-0.3, 0.2, 0.75);
        mallowEyeR.position.set(0.3, 0.2, 0.75);
        mallow.add(mallowBody); mallow.add(mallowEyeL); mallow.add(mallowEyeR);
        mallow.position.set(4, 2, 2);
        scene.add(mallow);


        // Floor
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI / 2; floor.position.y = -6.5; floor.receiveShadow = true;
        scene.add(floor);

        // --- CONSCIOUSNESS & ANIMATION STATE ---
        let currentState = "IDLE";
        let actionHistory = ["IDLE"]; // Memory
        let nextThoughtTime = 0;
        const THOUGHT_INTERVAL = 20;

        // State logic
        function resetPose() {
            // Smoothly reset rig groups in animate loop, but here we set targets or visibility
            props.laptop.visible = false;
            props.book.visible = false;
            props.wand.visible = false;
            screenMaterial.color.setHex(0xffffff);
            mainLight.color.setHex(0xffeeb1);
            scene.background.setHex(0x202025);
            wandTipMaterial.color.setHex(0x00ffff);
            rig.group.position.y = 0;
        }

        const bubbleEl = document.getElementById('thought-bubble');
        function showThought(text) {
            bubbleEl.innerText = text;
            bubbleEl.classList.add('visible');
            updateBubblePosition();
            setTimeout(() => bubbleEl.classList.remove('visible'), 5000);
        }
        function updateBubblePosition() {
            const headPos = new THREE.Vector3(0, 5, 0);
            headPos.applyMatrix4(rig.group.matrixWorld);
            headPos.project(camera);
            const x = (headPos.x * .5 + .5) * window.innerWidth;
            const y = (-(headPos.y * .5) + .5) * window.innerHeight;
            bubbleEl.style.left = `${x}px`; bubbleEl.style.top = `${y - 100}px`;
        }

        // --- GEMINI LOOP ---
        const statusIndicator = document.getElementById('consciousness-status');

        async function consciousTick() {
            statusIndicator.innerText = "Thinking...";
            const historyStr = actionHistory.slice(-3).join(", ");
            
            const systemPrompt = `
                You are Chip, a sentient 3D cookie with a sidekick Mallow.
                Current state history: [${historyStr}].
                Choose a NEW action (do not repeat the last one).
                
                ACTIONS:
                - "WALK": Pace around thinking.
                - "READ": Read a book.
                - "MAGIC": Cast a spell with wand.
                - "DANCE": Disco time.
                - "SLEEP": Nap.
                - "WORK": Code on laptop.
                - "FLOAT": Anti-gravity.

                Return JSON: {"action": "ACTION_NAME", "thought": "internal monologue (max 10 words)"}
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "What's next?" }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const decision = JSON.parse(data.candidates[0].content.parts[0].text);
                
                console.log("Chip Decided:", decision);
                showThought(decision.thought);
                addMessage(`*begins to ${decision.action.toLowerCase()}*`, 'system');
                
                resetPose(); // Reset visible props
                currentState = decision.action;
                actionHistory.push(currentState);
                statusIndicator.innerText = `Currently: ${decision.action}`;

                // Instant Prop Setup
                if(currentState === "WORK") {
                     props.laptop.visible = true;
                     props.laptop.position.copy(rig.leftHand.getWorldPosition(new THREE.Vector3()));
                }
                if(currentState === "READ") props.book.visible = true;
                if(currentState === "MAGIC") props.wand.visible = true;

            } catch (e) {
                console.error("Consciousness Glitch:", e);
                statusIndicator.innerText = "Brain Freeze";
            }
        }

        // --- Chat Logic ---
        const chatBtn = document.getElementById('chat-toggle-btn');
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesContainer = document.getElementById('chat-messages');
        let isChatOpen = false;

        chatBtn.addEventListener('click', () => { isChatOpen = !isChatOpen; chatWindow.classList.toggle('open', isChatOpen); });
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div'); msgDiv.className = `message ${sender}`; msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv); messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        async function callGeminiChat(userText) {
            addMessage(userText, 'user'); chatInput.value = '';
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }], systemInstruction: { parts: [{ text: "You are Chip. Short witty cookie reply." }] } })
                });
                const data = await response.json();
                addMessage(data.candidates?.[0]?.content?.parts?.[0]?.text || "Crumbs...", 'chip');
            } catch (error) { addMessage("Net error.", 'system'); }
        }
        sendBtn.addEventListener('click', () => { if(chatInput.value.trim()) callGeminiChat(chatInput.value.trim()); });
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter' && chatInput.value.trim()) callGeminiChat(chatInput.value.trim()); });

        // --- Animation Helpers ---
        const clock = new THREE.Clock();
        document.getElementById('loading').style.opacity = 0;

        // Simple LERP helper
        function lerpRot(obj, axis, target, speed) {
            obj.rotation[axis] = THREE.MathUtils.lerp(obj.rotation[axis], target, speed);
        }
        function lerpPos(obj, axis, target, speed) {
            obj.position[axis] = THREE.MathUtils.lerp(obj.position[axis], target, speed);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            if(bubbleEl.classList.contains('visible')) updateBubblePosition();
            if (time > nextThoughtTime) { consciousTick(); nextThoughtTime = time + THOUGHT_INTERVAL; }

            // Default/Reset targets
            let targetY = 0;
            let targetX = 0;
            let targetRotY = Math.sin(time * 0.5) * 0.1;
            let leftArmRotX = 0; let rightArmRotX = 0;
            let leftLegRotX = 0; let rightLegRotX = 0;
            let mallowTargetY = 2 + Math.sin(time * 2) * 0.2;
            let mallowTargetX = 4;

            switch(currentState) {
                case "WALK":
                    // Walking Logic: Sine waves for limbs
                    const walkSpeed = 5;
                    const stride = 0.6;
                    leftLegRotX = Math.sin(time * walkSpeed) * stride;
                    rightLegRotX = Math.sin(time * walkSpeed + Math.PI) * stride;
                    leftArmRotX = Math.sin(time * walkSpeed + Math.PI) * (stride * 0.5);
                    rightArmRotX = Math.sin(time * walkSpeed) * (stride * 0.5);
                    
                    // Move position back and forth
                    targetX = Math.sin(time * 0.5) * 6; 
                    targetRotY = Math.PI / 2 * (Math.cos(time * 0.5) > 0 ? 1 : -1); // Face direction
                    
                    // Bobbing
                    targetY = Math.abs(Math.sin(time * walkSpeed)) * 0.3;
                    
                    // Mallow follows
                    mallowTargetX = targetX - (Math.cos(time * 0.5) > 0 ? 3 : -3);
                    break;

                case "READ":
                    // Sit down
                    targetY = -3;
                    leftLegRotX = -Math.PI / 2;
                    rightLegRotX = -Math.PI / 2;
                    leftArmRotX = -0.5;
                    rightArmRotX = -1; // Holding book up
                    // Mallow peeks
                    mallowTargetX = 2;
                    mallowTargetY = 0; // Low down
                    break;

                case "MAGIC":
                    rightArmRotX = Math.sin(time * 5) * 0.5 - 1; // Wave wand
                    wandTipMaterial.color.setHSL(time * 0.5 % 1, 1, 0.5);
                    // Mallow floats erratically
                    mallowTargetY = 3 + Math.sin(time * 10) * 1;
                    break;

                case "WORK":
                    targetY = -3; // Sit
                    leftLegRotX = -Math.PI / 2; rightLegRotX = -Math.PI / 2;
                    leftArmRotX = -0.8; rightArmRotX = -0.8; // Typing
                    props.laptop.position.set(rig.group.position.x, -4, 2.5);
                    props.laptop.rotation.y = Math.PI;
                    props.laptop.visible = true;
                    screenMaterial.emissiveIntensity = 0.5 + Math.sin(time * 15) * 0.5;
                    break;

                case "DANCE":
                    scene.background.setHex(0x442244);
                    targetY = Math.abs(Math.sin(time * 8)) * 1.5;
                    leftArmRotX = Math.sin(time * 10) * 2;
                    rightArmRotX = Math.cos(time * 10) * 2;
                    targetRotY = time * 2;
                    mallowTargetY = 4;
                    break;
                
                case "FLOAT":
                    scene.background.setHex(0x87CEEB);
                    targetY = 3 + Math.sin(time) * 1;
                    leftLegRotX = 0.5; rightLegRotX = 0.5; // Dangle
                    leftArmRotX = -Math.PI; rightArmRotX = -Math.PI; // Superman
                    break;
            }

            // Apply Animations (Lerping for smoothness)
            const s = 0.1; // Smoothness factor
            lerpPos(rig.group, 'y', targetY, s);
            lerpPos(rig.group, 'x', targetX, s);
            lerpRot(rig.group, 'y', targetRotY, s);
            
            lerpRot(rig.leftLegPivot, 'x', leftLegRotX, s);
            lerpRot(rig.rightLegPivot, 'x', rightLegRotX, s);
            lerpRot(rig.leftArmPivot, 'x', leftArmRotX, s);
            lerpRot(rig.rightArmPivot, 'x', rightArmRotX, s);

            // Mallow Animation
            lerpPos(mallow, 'x', mallowTargetX, 0.05);
            lerpPos(mallow, 'y', mallowTargetY, 0.05);
            mallow.lookAt(rig.group.position);

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
