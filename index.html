<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip & Mallow: The Conscious Duo</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="loading">Baking Consciousness...</div>
    <div id="thought-bubble">Initializing...</div>
    <div id="canvas-container"></div>
    <div class="controls-info">Mouse Move: Rotate | Scroll: Zoom | Watch Chip Live</div>

    <!-- Chat Interface -->
    <button id="chat-toggle-btn" title="Chat with Chip">✨</button>
    <div id="chat-window">
        <div class="chat-header">
            <div><span>🍪</span> Chip</div>
            <div id="consciousness-status" class="status-indicator">Thinking...</div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message chip">I've got legs now! And a little friend called Mallow. Let's explore! ✨</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
